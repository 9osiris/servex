# servex example config: block style with virtual hosts.
# the older flat style (port/docroot/log at the top level only) still works.

port = 8080
workers = 32

# global access log; each server block can override it with its own log
log = ./access.log
# rotate the log past this many bytes, keeping this many archives (0 = off)
log_max_bytes = 10485760
log_archives = 5

server {
    host = localhost
    docroot = ./www
    dir_listing = on

    # token bucket: 100 requests/second, bursts up to 200
    rate = 100
    burst = 200

    # reverse proxy everything under /api/ to a local app server
    location /api/ {
        proxy_pass = 127.0.0.1:3000
    }

    # run executable files under /cgi-bin/ as cgi scripts
    location /cgi-bin/ {
        cgi = on
    }

    # websocket upgrades under /ws/
    location /ws/ {
        websocket = on
    }

    # tight per-path limit: 10/second, burst of 20
    location /limited/ {
        rate = 10
        burst = 20
    }

    # password-protected area (htpasswd file with plain or {SHA} entries)
    location /private/ {
        auth_realm = private area
        auth_file = ./private.htpasswd
    }
}
